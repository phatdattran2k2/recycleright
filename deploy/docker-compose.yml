version: "3.8"

services:
  recycleright:
    image: ghcr.io/phatdattran2k2/recycleright:latest
    runtime: nvidia
    restart: unless-stopped

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    volumes:
      - /home/jetson/recycleright/models:/models:ro

    environment:
      - MODEL_PATH=/home/jetson/recycleright/models/best_fp16.engine
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    privileged: true
    network_mode: host
