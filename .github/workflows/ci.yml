name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PDM
        run: pip install pdm
      - name: Install dev dependencies
        run: pdm install --dev
      - name: Run ruff
        run: pdm run ruff check src/ tests/

  test:
    name: Test (coverage ≥ 90%)
    runs-on: ubuntu-latest
    needs: lint
    env:
      ROS_DISTRO: ""
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PDM
        run: pip install pdm
      - name: Install dev dependencies
        run: pdm install --dev
      - name: Run pytest with coverage
        run: pdm run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=90 --ignore=tests/integration
      - name: Run accuracy gate
        run: python tests/accuracy_gate.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PDM
        run: pip install pdm
      - name: Install dev dependencies
        run: pdm install --dev
      - name: Run bandit
        run: pdm run bandit -r src/ -c pyproject.toml
      - name: Run pip-audit
        run: pdm run pip-audit --ignore-vuln PYSEC-2026-196

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/recycleright:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/recycleright:latest

  integration-test:
    name: Integration Test (Jetson)
    runs-on: [self-hosted, linux, arm64, jetson]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Pull image from GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/recycleright:sha-${{ github.sha }}
      - name: Run integration tests
        run: |
          docker run --rm --runtime nvidia \
            -e MODEL_PATH=/models/best_fp16.engine \
            -v /home/jetson/recycleright/models:/models:ro \
            ghcr.io/${{ github.repository_owner }}/recycleright:sha-${{ github.sha }} \
            pytest tests/integration/ -v --timeout=120
